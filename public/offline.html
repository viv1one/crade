<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crade — offline</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
      background: #0a0e17;
      color: #e3e8ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0; color: #4264b6; }
    p { margin: 0; max-width: 28rem; font-size: 0.9rem; color: #8792a2; line-height: 1.5; }
    button {
      margin-top: 0.5rem;
      background: #4264b6;
      color: white;
      border: none;
      border-radius: 7px;
      padding: 0.6rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #375397; }
  </style>
</head>
<body>
  <h1>Crade</h1>
  <p>
    You&rsquo;re offline. Crade needs a connection for live quotes, your portfolio, and everything
    else it shows — reconnect and try again.
  </p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
